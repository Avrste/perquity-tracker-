<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perquity · Voicemail Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1A2624" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Perquity" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #1A2624;
      --leaf: #7FE488;
      --leaf-dark: #4DB85A;
      --mint: #E6FDEA;
      --white: #FFFFFF;
      --bg: #F4F6F5;
      --text-primary: #1A2624;
      --text-secondary: #4A6158;
      --text-muted: #8AA89E;
      --border: #E0E8E4;
      --border-strong: #C5D9CF;
      --card: #FFFFFF;
      --employer-bg: #EAF1FF;
      --employer-color: #2563EB;
      --employee-bg: #E6FDEA;
      --employee-color: #16803C;
      --provider-bg: #FEF3C7;
      --provider-color: #92650A;
      --accountant-bg: #F3EEFF;
      --accountant-color: #7C3AED;
      --unknown-bg: #F1F5F3;
      --unknown-color: #4A6158;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--forest);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-p {
      width: 32px;
      height: 32px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .logo-p span {
      display: block;
      background: var(--leaf);
      border-radius: 3px;
      height: 5px;
      transition: width 0.3s ease;
    }
    .logo-p span:nth-child(1) { width: 100%; }
    .logo-p span:nth-child(2) { width: 68%; }
    .logo-p span:nth-child(3) { width: 40%; }
    .logo:hover .logo-p span:nth-child(2) { width: 80%; }
    .logo:hover .logo-p span:nth-child(3) { width: 55%; }

    .logo-wordmark { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: var(--white); }
    .header-pill {
      background: rgba(127,228,136,0.12);
      border: 1px solid var(--border-strong);
      color: var(--leaf);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    #btn-signout {
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }
    #btn-signout:hover { background: rgba(127,228,136,0.08); color: var(--leaf); border-color: var(--leaf); }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
      position: relative;
      z-index: 1;
    }

    /* ── Login screen ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75vh;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .login-glow {
      width: 80px;
      height: 80px;
      background: var(--mint);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }
    .login-glow svg { width: 36px; height: 36px; }
    #login-screen h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; color: var(--forest); margin-bottom: 10px; }
    #login-screen p { font-size: 15px; color: var(--text-secondary); margin-bottom: 2.5rem; max-width: 300px; line-height: 1.6; }
    #btn-login {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--leaf);
      color: var(--forest);
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 30px rgba(127,228,136,0.25);
    }
    #btn-login:hover { background: #93EDAC; transform: translateY(-1px); box-shadow: 0 0 40px rgba(127,228,136,0.35); }
    #btn-login svg { width: 18px; height: 18px; }

    /* ── Page title ── */
    .page-title {
      margin-bottom: 2rem;
      animation: fadeUp 0.4s ease both;
    }
    .page-title h1 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 700; color: var(--forest); margin-bottom: 4px; }
    .page-title .subtitle { font-size: 13px; color: var(--text-muted); }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.4s 0.05s ease both;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.25rem 1rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--border-strong); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--leaf), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; margin-bottom: 6px; }
    .stat-value { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; color: var(--forest); line-height: 1; }
    .stat-value.accent { color: var(--leaf-dark); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 1rem;
      animation: fadeUp 0.4s 0.1s ease both;
    }
    .filter-btn {
      padding: 7px 16px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--border-strong); color: var(--text-secondary); }
    .filter-btn.active {
      background: var(--leaf);
      border-color: var(--leaf);
      color: var(--forest);
      font-weight: 600;
    }
    .refresh-btn {
      margin-left: auto;
      padding: 7px 16px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--leaf); color: var(--leaf); }
    .refresh-btn:disabled { opacity: 0.35; cursor: default; }

    /* ── Sync time ── */
    .sync-time { font-size: 11px; color: var(--text-muted); margin-bottom: 1.25rem; animation: fadeUp 0.4s 0.08s ease both; }

    /* ── Error ── */
    .error-msg {
      display: none;
      background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.3);
      color: #FF9090;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    /* ── List ── */
    #list-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeUp 0.4s 0.15s ease both;
    }

    .vm-item { background: transparent; transition: background 0.15s; }
    .vm-item + .vm-item { border-top: 1px solid var(--border); }
    .vm-item.open { background: #F7FBF8; }

    .vm-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }
    .vm-row:hover { background: #F7FBF8; }
    .vm-item.done { opacity: 0.45; }
    .vm-item.done .vm-name { text-decoration: line-through; }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--text-muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      cursor: pointer;
    }
    .check-circle:hover { border-color: var(--leaf-dark); box-shadow: 0 0 8px rgba(78,184,90,0.2); }
    .check-circle.checked { background: var(--leaf); border-color: var(--leaf); box-shadow: 0 0 8px rgba(127,228,136,0.3); }
    .check-circle svg { width: 10px; height: 8px; display: none; }
    .check-circle.checked svg { display: block; }

    .vm-name { font-size: 14px; font-weight: 600; color: var(--forest); }
    .vm-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .vm-phone { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--leaf-dark); font-weight: 500; }
    .vm-detail { font-size: 11px; color: var(--text-muted); }
    .vm-detail.sep::before { content: '·'; margin-right: 8px; }

    .type-badge {
      font-size: 10px;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .note-preview {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--forest);
      background: var(--leaf);
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 600;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vm-right { display: flex; align-items: center; gap: 10px; }
    .vm-status { font-size: 11px; color: var(--leaf-dark); font-weight: 600; }
    .expand-chevron {
      font-size: 9px;
      color: var(--text-muted);
      transition: transform 0.2s;
      user-select: none;
    }
    .vm-item.open .expand-chevron { transform: rotate(180deg); color: var(--leaf-dark); }

    /* ── Expanded panel ── */
    .vm-expanded {
      border-top: 1px solid var(--border);
      background: #F7FBF8;
      animation: expandIn 0.2s ease both;
    }
    @keyframes expandIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .expanded-inner {
      padding: 16px 18px 18px 74px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .audio-section { display: flex; flex-direction: column; gap: 8px; }
    /* ── Two column layout ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    .col { display: flex; flex-direction: column; gap: 1rem; }
    .col-heading { margin-bottom: 0.25rem; }
    .col-heading h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--forest);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .col-heading .subtitle { font-size: 12px; color: var(--text-muted); }

    @media (max-width: 700px) {
      .two-col { grid-template-columns: 1fr; gap: 2rem; }
    }

    .email-item { background: transparent; transition: background 0.15s; }
    .email-item + .email-item { border-top: 1px solid var(--border); }
    .email-item.open { background: #F7FBF8; }
    .email-item.handled { opacity: 0.4; }
    .email-item.handled .email-subject { text-decoration: line-through; }

    .email-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }
    .email-row:hover { background: #F7FBF8; }

    .email-subject { font-size: 14px; font-weight: 600; color: var(--forest); }
    .email-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .email-from { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .email-age {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #FEF3C7;
      color: #92650A;
    }
    .email-age.urgent { background: #FEE2E2; color: #B91C1C; }

    .email-expanded { border-top: 1px solid var(--border); background: #F7FBF8; animation: expandIn 0.2s ease both; }
    .reply-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: var(--forest);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      align-self: flex-start;
    }
    .reply-btn:hover { opacity: 0.85; }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .load-audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--mint);
      color: var(--forest);
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-start;
    }
    .load-audio-btn:hover { background: #C8F5CE; }
    .load-audio-btn:disabled { opacity: 0.5; cursor: default; }
    audio { width: 100%; height: 38px; border-radius: 8px; accent-color: var(--leaf-dark); }
    .no-audio { font-size: 12px; color: var(--text-muted); }

    .notes-section { display: flex; flex-direction: column; gap: 8px; }
    .notes-input {
      width: 100%;
      min-height: 72px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text-primary);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.5;
    }
    .notes-input::placeholder { color: var(--text-muted); }
    .notes-input:focus { border-color: var(--leaf-dark); box-shadow: 0 0 0 3px rgba(127,228,136,0.15); }

    /* ── Empty / Loading states ── */
    .empty-state {
      padding: 4rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
    }
    .loading-state {
      padding: 4rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--leaf);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem 4rem; }
      .stats-grid { gap: 8px; }
      .stat-value { font-size: 28px; }
      .expanded-inner { padding-left: 18px; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-p"><span></span><span></span><span></span></div>
    <span class="logo-wordmark">PERQUITY</span>
  </a>
  <span class="header-pill">Voicemail Tracker</span>
  <button id="btn-signout">Sign out</button>
</header>

<main>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-glow">
      <svg viewBox="0 0 36 36" fill="none">
        <rect x="4" y="7" width="28" height="22" rx="3" stroke="#7FE488" stroke-width="1.5"/>
        <path d="M4 11l14 9 14-9" stroke="#7FE488" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Voicemail Tracker</h1>
    <p>Sign in with Google to pull your Telebroad voicemails from Gmail.</p>
    <button id="btn-login">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <!-- App -->
  <div id="app-screen" style="display:none;">
    <div id="error-msg" class="error-msg" style="display:none;"></div>

    <!-- Two column layout -->
    <div class="two-col">

      <!-- Left: Voicemails -->
      <div class="col">
        <div class="col-heading">
          <h2>Voicemails</h2>
          <div class="subtitle" id="sync-time">Loading…</div>
        </div>

        <div id="error-msg" class="error-msg"></div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Need callback</div>
            <div class="stat-value accent" id="stat-pending">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Done</div>
            <div class="stat-value" id="stat-done">—</div>
          </div>
        </div>

        <div class="toolbar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Need callback</button>
          <button class="filter-btn" data-filter="done">Called back</button>
          <button class="refresh-btn" id="btn-refresh">
            <span id="refresh-icon">↻</span> Refresh
          </button>
        </div>

        <div id="list-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Pulling voicemails from Gmail…</span>
          </div>
        </div>
      </div>

      <!-- Right: Unanswered emails -->
      <div class="col">
        <div class="col-heading">
          <h2>Unanswered emails <span class="section-count" id="email-count"></span></h2>
          <div class="subtitle">No reply sent after 12 hours</div>
        </div>

        <div id="email-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Checking inbox…</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const CLIENT_ID = "668495426215-0837kkoci2fuohh6lhmaa2rjkbv92vfr.apps.googleusercontent.com";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/drive.appdata";
const DRIVE_API = "https://www.googleapis.com/drive/v3";
const DRIVE_UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const SYNC_FILE = "perquity-vm-sync.json";
const GMAIL_API = "https://gmail.googleapis.com/gmail/v1";
// ─────────────────────────────────────────────────────────────────────────────

const TYPE_COLORS = {
  "Employer":           { bg: "var(--employer-bg)",   color: "var(--employer-color)" },
  "Employee":           { bg: "var(--employee-bg)",   color: "var(--employee-color)" },
  "Childcare Provider": { bg: "var(--provider-bg)",   color: "var(--provider-color)" },
  "Accountant":         { bg: "var(--accountant-bg)", color: "var(--accountant-color)" },
  "Unknown":            { bg: "var(--unknown-bg)",    color: "var(--unknown-color)" },
};

let accessToken = null;
let allVoicemails = [];
let allEmails = [];
let statuses = {};
let notes = {};
let emailStatuses = {};
let emailNotes = {};
let expandedId = null;
let expandedEmailId = null;
let audioUrls = {};
let currentFilter = "all";

function fmt(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " · " +
    d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function parseSubject(subject) {
  const m = subject.match(/New voicemail from (.+?) -(.+?) (\d+) in mailbox (\d+)/i);
  if (!m) return { callerType: "Unknown", callerName: subject, phone: "—", mailbox: "—" };
  const digits = m[3].replace(/\D/g, "");
  const d = digits.length === 11 ? digits.slice(1) : digits;
  const phone = d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : digits;
  return { callerType: m[1].trim(), callerName: m[2].trim(), phone, mailbox: m[4] };
}

function findAttachmentId(payload) {
  if (!payload) return null;
  if (payload.parts) {
    for (const part of payload.parts) {
      if (part.filename && part.filename.match(/\.(mp3|wav|ogg|m4a|mpeg)/i) && part.body?.attachmentId)
        return { attachmentId: part.body.attachmentId, mimeType: part.mimeType };
      const nested = findAttachmentId(part);
      if (nested) return nested;
    }
  }
  return null;
}

// ── Sync (Drive primary, localStorage fallback) ───────────────────────────────
let syncFileId = null;
let saveTimer  = null;

async function loadData() {
  // Always load localStorage first as instant baseline
  try { statuses = JSON.parse(localStorage.getItem("vm-statuses-v2") || "{}"); } catch(e) { statuses = {}; }
  try { notes    = JSON.parse(localStorage.getItem("vm-notes-v1")    || "{}"); } catch(e) { notes = {}; }

  // Then try to load from Drive (overrides localStorage with synced data)
  try {
    const res = await fetch(`${DRIVE_API}/files?spaces=appDataFolder&q=name='${SYNC_FILE}'&fields=files(id)`, {
      headers: { Authorization: "Bearer " + accessToken }
    });
    if (!res.ok) return;
    const list = await res.json();
    if (!list.files?.length) return;
    syncFileId = list.files[0].id;
    const file = await fetch(`${DRIVE_API}/files/${syncFileId}?alt=media`, {
      headers: { Authorization: "Bearer " + accessToken }
    });
    if (!file.ok) return;
    const data = await file.json();
    statuses      = data.statuses      || {};
    notes         = data.notes         || {};
    emailStatuses = data.emailStatuses || {};
    emailNotes    = data.emailNotes    || {};
    // Persist to localStorage too so it's instant next load
    localStorage.setItem("vm-statuses-v2", JSON.stringify(statuses));
    localStorage.setItem("vm-notes-v1",    JSON.stringify(notes));
  } catch(e) { /* Drive failed, localStorage already loaded above */ }
}

async function saveData() {
  // Always save to localStorage immediately
  localStorage.setItem("vm-statuses-v2", JSON.stringify(statuses));
  localStorage.setItem("vm-notes-v1",    JSON.stringify(notes));

  // Then push to Drive
  try {
    const payload = JSON.stringify({ statuses, notes, emailStatuses, emailNotes });
    if (syncFileId) {
      await fetch(`${DRIVE_UPLOAD}/files/${syncFileId}?uploadType=media`, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
        body: payload
      });
    } else {
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify({ name: SYNC_FILE, parents: ["appDataFolder"] })], { type: "application/json" }));
      form.append("file",     new Blob([payload], { type: "application/json" }));
      const res = await fetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
        method: "POST", headers: { Authorization: "Bearer " + accessToken }, body: form
      });
      const data = await res.json();
      if (data.id) syncFileId = data.id;
    }
  } catch(e) { /* Drive save failed, localStorage still has it */ }
}

// Debounce saves — waits 800ms after last change
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 800);
}

function startLogin() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT_URI,
    response_type: "token", scope: SCOPES, prompt: "select_account"
  });
  window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params;
}

// Silent token refresh — re-auths in a hidden iframe without interrupting the user
function silentRefresh() {
  return new Promise((resolve) => {
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    const params = new URLSearchParams({
      client_id: CLIENT_ID, redirect_uri: REDIRECT_URI,
      response_type: "token", scope: SCOPES, prompt: "none"
    });
    iframe.src = "https://accounts.google.com/o/oauth2/v2/auth?" + params;
    let done = false;
    iframe.onload = () => {
      try {
        const hash = new URLSearchParams(iframe.contentWindow.location.hash.slice(1));
        const token = hash.get("access_token");
        const expiresIn = parseInt(hash.get("expires_in") || "3600");
        if (token) {
          accessToken = token;
          localStorage.setItem("vm_access_token", token);
          localStorage.setItem("vm_token_expiry", Date.now() + (expiresIn - 120) * 1000);
          done = true;
          resolve(true);
        }
      } catch(e) {}
      if (!done) resolve(false);
      document.body.removeChild(iframe);
    };
    setTimeout(() => { if (!done) { resolve(false); try { document.body.removeChild(iframe); } catch(e) {} } }, 5000);
    document.body.appendChild(iframe);
  });
}

// Check token every 45 minutes and silently refresh
function scheduleTokenRefresh() {
  setInterval(async () => {
    const expiry = parseInt(localStorage.getItem("vm_token_expiry") || "0");
    if (Date.now() > expiry - 300000) { // refresh 5 min before expiry
      await silentRefresh();
    }
  }, 45 * 60 * 1000);
}

async function gmailGet(path) {
  const res = await fetch(GMAIL_API + path, { headers: { Authorization: "Bearer " + accessToken } });
  if (res.status === 401) { localStorage.removeItem("vm_access_token"); signOut(); return null; }
  return res.json();
}

async function fetchAttachmentUrl(msgId, attachmentId, mimeType) {
  const key = msgId + "_" + attachmentId;
  if (audioUrls[key]) return audioUrls[key];
  const data = await gmailGet(`/users/me/messages/${msgId}/attachments/${attachmentId}`);
  if (!data?.data) return null;
  const b64 = data.data.replace(/-/g, "+").replace(/_/g, "/");
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: mimeType || "audio/mpeg" });
  const url = URL.createObjectURL(blob);
  audioUrls[key] = url;
  return url;
}

async function fetchVoicemails() {
  setLoading(true); clearError();
  try {
    const data = await gmailGet("/users/me/messages?maxResults=100&q=from:VoiceMail@telebroad.com");
    if (!data || !data.messages) { renderList([]); setLoading(false); return; }

    const details = await Promise.all(
      data.messages.map(m => gmailGet(`/users/me/messages/${m.id}?format=full`))
    );

    allVoicemails = details.filter(Boolean).map(msg => {
      const headers = msg.payload?.headers || [];
      const subject = headers.find(h => h.name === "Subject")?.value || "";
      const dateStr = headers.find(h => h.name === "Date")?.value || "";
      const parsed = parseSubject(subject);
      const attachment = findAttachmentId(msg.payload);
      return {
        id: msg.id,
        date: dateStr ? new Date(dateStr).toISOString() : "",
        attachmentId: attachment?.attachmentId || null,
        attachmentMime: attachment?.mimeType || "audio/mpeg",
        ...parsed
      };
    }).sort((a, b) => new Date(b.date) - new Date(a.date));

    document.getElementById("sync-time").textContent =
      "Last synced " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    renderList(allVoicemails);
    setLoadingDone();
  } catch(e) {
    showError("Couldn't load voicemails — try refreshing.");
    setLoading(false);
  }
}

function renderList(vms) {
  const filtered = vms.filter(v => {
    if (currentFilter === "pending") return !statuses[v.id];
    if (currentFilter === "done")    return !!statuses[v.id];
    return true;
  });

  document.getElementById("stat-total").textContent   = vms.length;
  document.getElementById("stat-pending").textContent = vms.filter(v => !statuses[v.id]).length;
  document.getElementById("stat-done").textContent    = vms.filter(v => !!statuses[v.id]).length;

  const container = document.getElementById("list-container");
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">${currentFilter === "pending" ? "All caught up 🎉" : "Nothing here yet"}</div>`;
    return;
  }

  container.innerHTML = filtered.map(v => {
    const isDone = !!statuses[v.id];
    const isOpen = expandedId === v.id;
    const tc = TYPE_COLORS[v.callerType] || TYPE_COLORS.Unknown;
    const note = notes[v.id] || "";

    return `
      <div class="vm-item ${isDone ? "done" : ""} ${isOpen ? "open" : ""}" data-id="${v.id}">
        <div class="vm-row">
          <div class="check-circle ${isDone ? "checked" : ""}" data-check="${v.id}">
            <svg viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#1A2624" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="vm-info" data-expand="${v.id}">
            <div class="vm-name">${v.callerName}</div>
            <div class="vm-meta">
              <span class="vm-phone">${v.phone}</span>
              <span class="vm-detail sep">Box ${v.mailbox}</span>
              <span class="vm-detail sep">${fmt(v.date)}</span>
              <span class="type-badge" style="background:${tc.bg};color:${tc.color}">${v.callerType}</span>
              ${note ? `<span class="note-preview">📝 ${note.slice(0,45)}${note.length > 45 ? "…" : ""}</span>` : ""}
            </div>
          </div>
          <div class="vm-right" data-expand="${v.id}">
            ${isDone ? `<span class="vm-status">✓ Done</span>` : ""}
            <span class="expand-chevron">▼</span>
          </div>
        </div>

        ${isOpen ? `
        <div class="vm-expanded">
          <div class="expanded-inner">
            ${v.attachmentId ? `
              <div class="audio-section">
                <div class="section-label">🎙 Recording</div>
                <div id="audio-wrap-${v.id}">
                  <button class="load-audio-btn" data-msgid="${v.id}" data-attid="${v.attachmentId}" data-mime="${v.attachmentMime}">
                    ▶ Play voicemail
                  </button>
                </div>
              </div>` : `<div class="no-audio">No audio attachment found</div>`}
            <div class="notes-section">
              <div class="section-label">Notes</div>
              <textarea class="notes-input" data-noteid="${v.id}" placeholder="Add a note about this call…">${note}</textarea>
            </div>
          </div>
        </div>` : ""}
      </div>`;
  }).join("");

  container.querySelectorAll("[data-check]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      const id = el.dataset.check;
      statuses[id] = !statuses[id];
      scheduleSave();
      renderList(allVoicemails);
    });
  });

  container.querySelectorAll("[data-expand]").forEach(el => {
    el.addEventListener("click", e => {
      const id = el.dataset.expand;
      expandedId = expandedId === id ? null : id;
      renderList(allVoicemails);
    });
  });

  container.querySelectorAll(".load-audio-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const { msgid, attid, mime } = btn.dataset;
      btn.textContent = "Loading…"; btn.disabled = true;
      const url = await fetchAttachmentUrl(msgid, attid, mime);
      const wrap = document.getElementById("audio-wrap-" + msgid);
      wrap.innerHTML = url
        ? `<audio controls src="${url}"></audio>`
        : `<span class="no-audio">Couldn't load audio</span>`;
    });
  });

  container.querySelectorAll(".notes-input").forEach(ta => {
    ta.addEventListener("input", e => { e.stopPropagation(); notes[ta.dataset.noteid] = ta.value; scheduleSave(); });
    ta.addEventListener("click", e => e.stopPropagation());
  });
}

function setLoading(on) {
  document.getElementById("btn-refresh").disabled = on;
  document.getElementById("refresh-icon").textContent = on ? "" : "↻";
  if (on) document.getElementById("list-container").innerHTML =
    `<div class="loading-state"><div class="spinner"></div><span>Pulling voicemails from Gmail…</span></div>`;
}

function setLoadingDone() {
  document.getElementById("btn-refresh").disabled = false;
  document.getElementById("refresh-icon").textContent = "↻";
}

function showError(msg) { const el = document.getElementById("error-msg"); el.textContent = msg; el.style.display = "block"; }
function clearError()   { document.getElementById("error-msg").style.display = "none"; }

function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  document.getElementById("btn-signout").style.display = "block";
}

function signOut() {
  localStorage.removeItem("vm_access_token");
  accessToken = null;
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("btn-signout").style.display = "none";
}

// ── Unanswered emails ─────────────────────────────────────────────────────────
function fmtAge(ms) {
  const h = Math.floor(ms / 3600000);
  const d = Math.floor(h / 24);
  if (d >= 1) return `${d}d ago`;
  return `${h}h ago`;
}

async function fetchEmails() {
  document.getElementById("email-container").innerHTML =
    `<div class="loading-state"><div class="spinner"></div><span>Checking inbox…</span></div>`;
  try {
    const cutoff = Date.now() - 4 * 3600000; // 4 hours
    const data = await gmailGet("/users/me/threads?maxResults=100&q=in:inbox -from:me");
    if (!data?.threads?.length) { renderEmails([]); return; }

    // Fetch full threads with snippets
    const threads = await Promise.all(
      data.threads.map(t => gmailGet(`/users/me/threads/${t.id}?format=full`))
    );

    const candidates = threads.filter(Boolean).map(thread => {
      const msgs = thread.messages || [];
      if (!msgs.length) return null;
      const lastMsg = msgs[msgs.length - 1];
      const headers = lastMsg.payload?.headers || [];
      const from    = headers.find(h => h.name === "From")?.value    || "";
      const subject = headers.find(h => h.name === "Subject")?.value || "(no subject)";
      const date    = parseInt(lastMsg.internalDate) || 0;
      const snippet = lastMsg.snippet || "";

      // Skip if we replied after the first message
      const myReply = msgs.slice().reverse().find(m => {
        const mFrom = (m.payload?.headers || []).find(h => h.name === "From")?.value || "";
        return mFrom.includes("info@perquity.com") || mFrom.includes("yechiel@perquity.com");
      });
      if (date > cutoff) return null;
      if (myReply && parseInt(myReply.internalDate) > parseInt(msgs[0].internalDate)) return null;

      return { id: thread.id, from, subject, date, age: Date.now() - date, snippet };
    }).filter(Boolean).sort((a, b) => b.age - a.age);

    if (!candidates.length) { renderEmails([]); return; }

    document.getElementById("email-container").innerHTML =
      `<div class="loading-state"><div class="spinner"></div><span>Filtering with AI…</span></div>`;

    const emailList = candidates.map((e, i) =>
      `${i}: FROM: ${e.from} | SUBJECT: ${e.subject} | SNIPPET: ${e.snippet.slice(0, 120)}`
    ).join("\n");

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 500,
        system: `You filter emails for Yechiel, owner of Perquity — a childcare employee benefits company in New York. His email is info@perquity.com.

Return a JSON array of index numbers to EXCLUDE. Exclude ONLY:
- Automated bank/financial alerts (Fundbox, Capital One, etc.)
- Marketing newsletters (has "unsubscribe" in snippet)
- Automated SaaS/system notifications (no-reply senders, automated reports)
- Spam and phishing
- Shipping/order confirmations
- Social media notifications

ALWAYS KEEP:
- Any real person asking a question or requesting info
- Employers or HR people asking about childcare benefits
- Childcare providers contacting about enrollment or payments  
- CPAs or accountants asking about tax credits
- Anyone who found Perquity and wants to learn more
- Website contact form submissions
- Any email that could be a business lead, even if from a company domain

When in doubt — KEEP IT. Missing a real lead is worse than seeing extra emails.
Return ONLY raw JSON like [1,4,7] or [] — nothing else.`,
        messages: [{ role: "user", content: emailList }]
      })
    });
    const aiData = await res.json();
    const text = (aiData.content || []).find(b => b.type === "text")?.text || "[]";
    let exclude = [];
    try { exclude = JSON.parse(text.replace(/```json|```/g, "").trim()); } catch(e) { exclude = []; }

    allEmails = candidates.filter((_, i) => !exclude.includes(i));
    renderEmails(allEmails);
  } catch(e) {
    document.getElementById("email-container").innerHTML =
      `<div class="empty-state" style="color:var(--text-muted)">Couldn't load emails</div>`;
  }
}

function renderEmails(emails) {
  const visible = emails.filter(e => !emailStatuses[e.id]);
  const done    = emails.filter(e =>  emailStatuses[e.id]).length;
  const total   = emails.length;

  const countEl = document.getElementById("email-count");
  if (countEl) countEl.textContent = visible.length > 0 ? visible.length : "";

  const container = document.getElementById("email-container");
  const all = [...emails]; // show all including handled

  if (all.length === 0) {
    container.innerHTML = `<div class="empty-state">All caught up 📬</div>`;
    return;
  }

  container.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;">
      ${all.map((e, i) => {
        const isHandled = !!emailStatuses[e.id];
        const isOpen    = expandedEmailId === e.id;
        const note      = emailNotes[e.id] || "";
        const ageStr    = fmtAge(e.age);
        const urgent    = e.age > 24 * 3600000;
        const fromName  = e.from.replace(/<.*>/, "").replace(/"/g, "").trim() || e.from;

        return `
        <div class="email-item ${isHandled ? "handled" : ""} ${isOpen ? "open" : ""}" data-eid="${e.id}"
             style="${i > 0 ? "border-top:1px solid var(--border);" : ""}">
          <div class="email-row">
            <div class="check-circle ${isHandled ? "checked" : ""}" data-echeck="${e.id}">
              <svg viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#1A2624" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div data-eexpand="${e.id}">
              <div class="email-subject">${e.subject}</div>
              <div class="email-meta">
                <span class="email-from">${fromName}</span>
                <span class="email-age ${urgent ? "urgent" : ""}">⏱ ${ageStr}</span>
                ${note ? `<span class="note-preview">📝 ${note.slice(0,40)}${note.length>40?"…":""}</span>` : ""}
              </div>
            </div>
            <div class="vm-right" data-eexpand="${e.id}">
              ${isHandled ? `<span class="vm-status">✓ Done</span>` : ""}
              <span class="expand-chevron">▼</span>
            </div>
          </div>
          ${isOpen ? `
          <div class="email-expanded">
            <div class="expanded-inner">
              <div>
                <a class="reply-btn" href="https://mail.google.com/mail/u/0/#inbox/${e.id}" target="_blank">
                  ↗ Reply in Gmail
                </a>
              </div>
              <div class="notes-section">
                <div class="section-label">Notes</div>
                <textarea class="notes-input" data-enoteid="${e.id}" placeholder="Add a note…">${note}</textarea>
              </div>
            </div>
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>`;

  // Check circle
  container.querySelectorAll("[data-echeck]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      const id = el.dataset.echeck;
      emailStatuses[id] = !emailStatuses[id];
      scheduleSave();
      renderEmails(allEmails);
    });
  });

  // Expand
  container.querySelectorAll("[data-eexpand]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.eexpand;
      expandedEmailId = expandedEmailId === id ? null : id;
      renderEmails(allEmails);
    });
  });

  // Notes
  container.querySelectorAll("[data-enoteid]").forEach(ta => {
    ta.addEventListener("input", e => { e.stopPropagation(); emailNotes[ta.dataset.enoteid] = ta.value; scheduleSave(); });
    ta.addEventListener("click", e => e.stopPropagation());
  });
}

async function init() {
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const token = hash.get("access_token");
  const expiresIn = parseInt(hash.get("expires_in") || "3600");
  if (token) {
    accessToken = token;
    localStorage.setItem("vm_access_token", token);
    localStorage.setItem("vm_token_expiry", Date.now() + (expiresIn - 120) * 1000);
    window.history.replaceState({}, "", REDIRECT_URI);
    showApp();
    scheduleTokenRefresh();
    await loadData();
    fetchVoicemails();
    fetchEmails();
    return;
  }
  const stored = localStorage.getItem("vm_access_token");
  if (stored) {
    accessToken = stored;
    // Try silent refresh immediately if token is expired or close to expiry
    const expiry = parseInt(localStorage.getItem("vm_token_expiry") || "0");
    if (Date.now() > expiry) {
      const ok = await silentRefresh();
      if (!ok) { document.getElementById("login-screen").style.display = "flex"; return; }
    }
    showApp();
    scheduleTokenRefresh();
    await loadData();
    fetchVoicemails();
    fetchEmails();
    return;
  }
  document.getElementById("login-screen").style.display = "flex";
}

document.getElementById("btn-login").addEventListener("click", startLogin);
document.getElementById("btn-signout").addEventListener("click", signOut);
document.getElementById("btn-refresh").addEventListener("click", () => window.location.reload());
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList(allVoicemails);
  });
});

init();
